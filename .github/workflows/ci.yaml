name: ci

on:
  pull_request:
    branches:
      - main
  # main への直接 push でも ruff / format が走るようにする。gh-pages.yaml の build は
  # mypy と pytest しか持たないため、push トリガが無いと lint だけ素通りしていた。
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 以下のセットアップ手順は gh-pages.yaml の build ジョブと意図的に同じ内容。
      # 両方とも .github/workflows 配下なので Dependabot が同一 PR で両者を bump する。
      - uses: actions/checkout@v7

      # ワークフロー定義自体の静的検査。uv のセットアップより前に置いて早く落とす。
      - name: Lint workflows
        uses: raven-actions/actionlint@v2.2.0

      # actionlint は式の中身しか検査しない。二重波括弧が一重に潰れると、YAML としても
      # ワークフロー定義としても妥当な「ただの文字列」になり、警告なしで素通りしてしまう
      # (2026-09-04: 実際に 6 リポジトリで Dependabot auto-merge が数日サイレントに壊れた)。
      # 潰れた式を機械的に弾く。シェル変数の展開は波括弧の直後に空白を置かず、変数名に
      # ドットや括弧も含まないため誤検知しない。
      - name: Guard against collapsed expressions
        run: |
          if grep -rnE '\$\{ |\$\{(github|secrets|steps|env|inputs|matrix|needs|runner|job|jobs|vars|strategy|hashFiles)[.(]' .github/workflows/; then
            echo "::error::GitHub Actions の式が波括弧 1 組に潰れている。上記の箇所を二重波括弧に直すこと"
            exit 1
          fi

      # uv 本体のバージョンは pyproject.toml の [dependency-groups] ci にピンしてあり、
      # Dependabot (uv エコシステム) がそれを bump する。ここでその値を読み取り setup-uv に渡す。
      - name: Resolve uv version
        id: uv-version
        run: |
          version=$(grep -oP '"uv==\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          if [ -z "$version" ]; then
            echo "::error::could not resolve uv version pin from pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      # --locked: `--frozen` は uv.lock を使うだけで pyproject.toml との整合性を検証しない。
      # Dependabot PR の lock ずれはここでしか検出できないため --locked を使う。
      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 以下のセットアップ手順は gh-pages.yaml の build ジョブと意図的に同じ内容。
      # 両方とも .github/workflows 配下なので Dependabot が同一 PR で両者を bump する。
      - uses: actions/checkout@v7

      # uv 本体のバージョンは pyproject.toml の [dependency-groups] ci にピンしてあり、
      # Dependabot (uv エコシステム) がそれを bump する。ここでその値を読み取り setup-uv に渡す。
      - name: Resolve uv version
        id: uv-version
        run: |
          version=$(grep -oP '"uv==\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          if [ -z "$version" ]; then
            echo "::error::could not resolve uv version pin from pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ steps.uv-version.outputs.version }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --frozen --all-extras

      - name: Type check
        run: uv run mypy main.py

      - name: Run tests
        run: uv run pytest

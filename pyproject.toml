[project]
name = "manga-one-rss"
version = "0.1.0"
description = "Atom RSS feed generator for マンガワン (manga-one.com) free chapters"
requires-python = ">=3.13"
dependencies = [
    "feedgenerator>=2.2.1",
    "jinja2>=3.1.6",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6",
    "requests-mock>=1.12.1",
    "mypy>=2.3.0",
    "ruff>=0.16.4",
    "pre-commit>=4.6.2",
    "types-requests>=2.33.0.20260712",
]

[dependency-groups]
# uv 本体のバージョンピン。Dependabot (uv エコシステム) がこの行を bump し、
# CI (.github/workflows/gh-pages.yaml) が setup-uv に渡す version をここから読む。
# 既定グループではないため `uv sync` で venv にはインストールされない。
ci = ["uv==0.12.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=main --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C90", # mccabe complexity
    "RUF",
    "PTH", # use pathlib
    "PL",  # pylint
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
files = ["main.py", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["feedgenerator"]
ignore_missing_imports = true
